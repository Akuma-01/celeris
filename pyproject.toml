[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "celeris"
version = "0.1.0"
description = "Celeris Automobili Industrial Demand Forecasting & Planning"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "streamlit>=1.30.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
]

[project.scripts]
celeris = "celeris.__main__:main"

[tool.setuptools.packages.find]
include = ["celeris*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
